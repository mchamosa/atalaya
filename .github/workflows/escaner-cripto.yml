name: Escáner cripto

on:
  schedule:
    - cron: "10 0 * * *"        # tras el cierre de la vela diaria (00:00 UTC): señales y registro
    - cron: "40 7,8 * * 1-5"    # apertura de Londres (una de las dos cae a los 40 min según el horario de verano)
    - cron: "10 14,15 * * 1-5"  # apertura de Nueva York (ídem)
    - cron: "10 6,12,18 * * *"  # resto del día: solo actualiza el registro
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [scan, session, update]
        default: scan
      sesion:
        description: "Sesión a escanear a mano (solo con session)"
        type: choice
        options: [auto, ny, london]
        default: auto

permissions:
  contents: write

concurrency:
  group: escaner-cripto
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escanear
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODO="${{ inputs.modo }}"
          if [ -z "$MODO" ]; then
            case "${{ github.event.schedule }}" in
              "10 0 * * *") MODO=scan ;;
              "40 7,8 * * 1-5"|"10 14,15 * * 1-5") MODO=session ;;
              *) MODO=update ;;
            esac
          fi
          SES="${{ inputs.sesion }}"
          if [ "$MODO" = "session" ] && [ -n "$SES" ] && [ "$SES" != "auto" ]; then
            python scripts/escaner_cripto.py session "$SES"
          else
            python scripts/escaner_cripto.py "$MODO"
          fi
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/salida
          cp data/cripto_escaner.json data/cripto_registro.json /tmp/salida/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/salida/* data/ 2>/dev/null || true
          git add data/cripto_escaner.json data/cripto_registro.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Escáner cripto $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
