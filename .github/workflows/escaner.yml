name: Escáner de acciones

on:
  schedule:
    # Varias pasadas: el script decide qué toca según la hora de Nueva York (modo auto),
    # así da igual que GitHub lance con retraso o que cambie el horario de verano.
    - cron: "7 12 * * 1-5"      # pre-apertura (7:07 u 8:07 en NY)
    - cron: "37 12 * * 1-5"     # pre-apertura de reserva
    - cron: "7 13 * * 1-5"      # pre-apertura de reserva
    - cron: "53 13 * * 1-5"     # ruptura de apertura en verano (9:53 NY)
    - cron: "23 14 * * 1-5"     # reserva
    - cron: "53 14 * * 1-5"     # ruptura de apertura en invierno (9:53 NY)
    - cron: "23 15 * * 1-5"     # reserva
    - cron: "17 21 * * 1-5"     # tras el cierre: actualiza el registro
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué escanear"
        type: choice
        options: [auto, premarket, orb, update]
        default: auto

permissions:
  contents: write

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pdftotext (para leer las declaraciones del Congreso)
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Escanear
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODO="${{ inputs.modo }}"
          if [ -z "$MODO" ]; then MODO=auto; fi
          python scripts/escaner.py "$MODO"
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/salida
          cp data/escaner.json data/escaner_congreso.json data/cartera.json /tmp/salida/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/salida/* data/ 2>/dev/null || true
          git add data/escaner.json data/escaner_congreso.json data/cartera.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Escáner $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
