name: Velas de 5 minutos (Apertura)

on:
  schedule:
    - cron: "15 6 * * 2-6"     # cada mañana de martes a sábado (UTC), con la sesión anterior ya publicada
  workflow_dispatch:            # botón "Run workflow" manual
    inputs:
      full:
        description: "Volver a descargar los 2 años completos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar velas de 5 minutos
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/update_intraday.py --full
          else
            python scripts/update_intraday.py
          fi
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday
          git diff --cached --quiet || git commit -m "Velas de 5 min $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
